name: Offline benchmark checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract and regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest study.test_contract study.test_ledger analysis.test_analysis analysis.test_audit -v
      - name: Verify all 360 formal labels
        run: python -m benchmarks.challenge.check_oracle --data data/challenge/main-v1 --output "$RUNNER_TEMP/oracle-check.json"
      - name: Verify numerical claims and citation keys
        run: python scripts/verify_report_claims.py
